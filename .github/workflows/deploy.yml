# MUSE deploy to VPS on push to main
#
# Triggers on push to MUNENE1212/Muse:main (after the CI workflows
# complete) and on workflow_dispatch. Uses an SSH key (added to
# /opt/muse/.ssh/authorized_keys on the VPS) to run the deploy script
# at /opt/muse/deploy/deploy-muse.sh, which:
#   1. git fetch + reset --hard origin/main
#   2. mirror /opt/muse/shared/.env into /opt/muse/repo/.env
#   3. docker compose build --pull
#   4. docker compose up -d --remove-orphans
#   5. wait for ai-engine + frontend-gateway healthcheck
#   6. write a pre-deploy pg_dump to /opt/muse/backups/
name: Deploy Muse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST:     ${{ vars.VPS_HOST     || secrets.VPS_HOST }}
          VPS_USER:     ${{ vars.VPS_USER     || secrets.VPS_USER }}
          VPS_PORT:     ${{ vars.VPS_PORT     || secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::VPS_HOST and VPS_USER must be set as repo vars or secrets"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -p "${VPS_PORT:-22}" -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${VPS_USER}@${VPS_HOST}" \
              'bash /opt/muse/deploy/deploy-muse.sh'
